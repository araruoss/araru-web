services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: araru, POSTGRES_USER: araru, POSTGRES_PASSWORD: araru }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U araru -d araru"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  server:
    image: ghcr.io/araruoss/araru-server:latest
    environment:
      DATABASE_URL: postgresql://araru:araru@postgres:5432/araru
      REDIS_URL: redis://redis:6379
      LOCAL_LIBRARY_DIR: /library
      ENABLE_GOOGLE_DRIVE: "false"
      FRONTEND_URL: http://localhost:8080
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "npm", "run", "health"], interval: 5s, timeout: 5s, retries: 20 }
  web:
    image: ghcr.io/araruoss/araru-web:latest
    environment: { API_UPSTREAM: http://server:3001 }
    ports: ["8080:80"]
    depends_on: { server: { condition: service_healthy } }
