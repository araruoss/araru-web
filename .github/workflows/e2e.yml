name: Full-stack E2E
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: docker compose -f deploy/e2e-compose.yml up -d --wait
      - run: E2E_BASE_URL=http://localhost:8080 CHROME_PATH=/usr/bin/google-chrome npm run test:e2e
      - if: always()
        run: docker compose -f deploy/e2e-compose.yml logs
